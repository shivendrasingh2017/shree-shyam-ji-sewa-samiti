<section class="gallery">
  <div class="container">
    <div class="section-title">
      <span class="sub">✨ &nbsp; GALLERY &nbsp; ✨</span>
      <h2>Our Divine Moments</h2>
    </div>

    <div *ngIf="galleryItems.length === 0" class="gallery-empty">
      <p>No active gallery images are available right now.</p>
      <p>Visit the admin panel to add and activate images.</p>
    </div>

    <div class="grid" *ngIf="galleryItems.length > 0">
      <div class="gallery-card" *ngFor="let item of galleryItems">
        <img [src]="item.imageUrl" [alt]="item.title" />
        <div class="gallery-caption">
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
